name: "netbox"

x-lockdown: &lockdown
  # prevents write access to the image itself
  read_only: true
  # prevents any process within the container to gain more privileges
  security_opt:
    - "no-new-privileges=true"

services:
  postgres:
    image: "11notes/postgres:18"
    <<: *lockdown
    environment:
      TZ: "Europe/Zurich"
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432/tcp"
    networks:
      frontend:
    volumes:
      - "postgres.etc:/postgres/etc"
      - "postgres.var:/postgres/var"
    tmpfs:
      - "/postgres/run:uid=1000,gid=1000"
      - "/postgres/log:uid=1000,gid=1000"
    restart: "always"

  redis:
    image: "11notes/redis:8"
    <<: *lockdown
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      TZ: "Europe/Zurich"
    networks:
      backend:
    volumes:
      - "redis.etc:/redis/etc"
      - "redis.var:/redis/var"
    tmpfs:
      - "/run:uid=1000,gid=1000"
    restart: "always"

  netbox:
    depends_on:
      postgres:
        condition: "service_healthy"
        restart: true
      redis:
        condition: "service_healthy"
        restart: true
    image: "11notes/netbox:4.7.5"
    <<: *lockdown
    environment:
      TZ: "Europe/Zurich"
      DB_PASSWORD: "${POSTGRES_PASSWORD}"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      SECRET_KEY: "${SECRET_KEY}"
      API_TOKEN_PEPPER_1: "${API_TOKEN_PEPPER}"
      NETBOX_ADMIN: "admin"
      NETBOX_ADMIN_PASSWORD: ${NETBOX_ADMIN_PASSWORD}
    volumes:
      - "etc:/netbox/etc"
      - "var:/netbox/var"
    tmpfs:
      - "/run:uid=1000,gid=1000"
    ports:
      - "3000:8080/tcp"
    networks:
      frontend:
      backend:
    restart: "always"

volumes:
  etc:
  var:
  postgres.etc:
  postgres.var:
  redis.etc:
  redis.var:

networks:
  frontend:
  backend:
    internal: true